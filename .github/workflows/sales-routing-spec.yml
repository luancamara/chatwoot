name: Sales routing and Hermes ledger

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sales-routing-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  sales-routing:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
    env:
      RAILS_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: ''
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Prepare isolated database
        run: bundle exec rails db:create db:schema:load
      - name: Exercise store routing, reporting, policy controls and localized notifications
        run: >-
          bundle exec rspec
          spec/enterprise/services/sales_routing
          spec/enterprise/jobs/sales_routing
          spec/enterprise/controllers/api/v1/accounts/store_team_members_spec.rb
          spec/enterprise/controllers/api/v1/accounts/response_reassignment_settings_spec.rb
          spec/enterprise/services/enterprise/auto_assignment/assignment_service_spec.rb
          spec/enterprise/services/enterprise/auto_assignment/assignment_service_policy_controls_spec.rb
          spec/services/auto_assignment/assignment_service_spec.rb
          spec/services/auto_assignment/rate_limiter_spec.rb
          spec/jobs/auto_assignment
          spec/mailers
          spec/enterprise/mailers/enterprise/agent_notifications/conversation_notifications_mailer_spec.rb
          spec/enterprise/mailers/enterprise/device_verification_mailer_spec.rb
          spec/enterprise/mailers/devise_mailer_spec.rb
          spec/controllers/api/v1/accounts/inbox_archiving_spec.rb
          spec/models/concerns/cache_keys_spec.rb
          --format documentation
